services:
  mongodb:
    image: mongo:7
    container_name: aurik-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aurik-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Mongo__ConnectionString: mongodb://mongodb:27017
      Mongo__DatabaseName: aurik_monitoring
      Seed__RunOnStartup: "true"
      Seed__SeedDirectory: /app/seed
      Auth__VendorApiKeys__PulseForge: pf-dev-key-change-me
      Auth__VendorApiKeys__ThermexWatch: tw-dev-key-change-me
      Auth__VendorApiKeys__MaintaFlow: mf-dev-key-change-me
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongodb_data:
